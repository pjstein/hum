[project]
name = "hum-reference"
version = "0.0.0"
description = "Hum reference implementation: a small, readable Python port of every spec rule with bytes or numbers in it. Generates vectors/."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hum-vectors = "hum_reference.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hum_reference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
