[package]
name = "hum-ffi"
description = "Hum core: the app-facing API and uniffi bindings (empty until wave 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]

# This crate does not inherit the workspace lints because it is the one crate
# allowed to contain `unsafe` (FFI). Everything else is the same as the
# workspace table in /Cargo.toml.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
