<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8D44D}a:hover{color:#F4E57A}
</style>
</helmet>
<div style="width: 390px; height: 1140px; box-sizing: border-box; background: #0F1115; color: #F3F1EA; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 24px 20px; gap: 16px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; align-items: center; gap: 12px">
      <a href="B-Home.dc.html" aria-label="Back" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #181B21; color: #F3F1EA">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Studio</h1>
    </span>
    <a href="S-Studio.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 12px; background: #E8D44D; color: #0F1115; font-size: 14px; font-weight: 800; text-decoration: none">New take</a>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #181B21; border-radius: 12px">
    <button type="button" style="height: 38px; border: none; border-radius: 9px; background: #F3F1EA; color: #0F1115; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Gallery</button>
    <button type="button" style="height: 38px; border: none; border-radius: 9px; background: transparent; color: #F3F1EA; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">My takes</button>
    <button type="button" style="height: 38px; border: none; border-radius: 9px; background: transparent; color: #F3F1EA; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Data</button>
  </div>

  <a href="S-Take.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid #E8D44D; border-radius: 16px; text-decoration: none; color: #F3F1EA">
    <span style="position: relative; flex: none; width: 44px; height: 52px">
      <span style="position: absolute; inset: 0; transform: rotate(-8deg); border-radius: 6px; background: #3A404A"></span>
      <span style="position: absolute; inset: 0; transform: rotate(6deg); border-radius: 6px; background: #F3F1EA"></span>
    </span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 800">Rate 5 new takes</span>
      <span style="font-size: 13px; color: #B9BDC4">Swipe: fair or misleading</span>
    </span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8D44D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #B9BDC4">
    <span>Ranked by <strong style="color: #F3F1EA">fair to every group</strong></span>
    <span style="font-family: 'DM Mono', monospace">All contexts</span>
  </div>

  <sc-for list="{{takes}}" as="t" hint-placeholder-count="3">
    <a href="S-Take.dc.html" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: #F3F1EA; color: #0F1115; text-decoration: none">
      <span style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #4A4F57">
        <span>{{t.source}}</span><span style="font-family: 'DM Mono', monospace">{{t.author}}</span>
      </span>
      <span style="font-size: 21px; line-height: 1.12; font-weight: 800">{{t.title}}</span>
      <span style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{t.bars}}" as="b" hint-placeholder-count="3">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="width: 96px; font-size: 11px; font-weight: 600; color: #4A4F57; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.label}}</span>
            <span style="flex: 1; height: 9px; background: #E0DDD3; border-radius: 2px"><span style="display: block; width: {{b.w}}; height: 9px; background: {{b.c}}; border-radius: 2px"></span></span>
            <span style="width: 30px; text-align: right; font-family: 'DM Mono', monospace; font-size: 11px">{{b.v}}</span>
          </span>
        </sc-for>
      </span>
      <span style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600">
        <span style="padding: 4px 8px; border-radius: 6px; background: #0F1115; color: #F3F1EA">{{t.fair}}</span>
        <span style="color: #4A4F57">{{t.forks}} forks</span>
      </span>
      <sc-if value="{{t.noise}}" hint-placeholder-val="{{false}}">
        <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: #F6DCCB; color: #6E2F0E">1 difference shown is within noise</span>
      </sc-if>
    </a>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    const blue = '#1F5FCC', ink = '#0F1115', gray = '#8D939C';
    const bar = (label, v, c) => ({ label, v: v + '%', w: v + '%', c });
    return {
      takes: [
        { title: 'Both camps want eviction protections first', author: '@mara.k', source: 'Millbrook · Release 3',
          fair: 'Fair to A 81% · B 76%', forks: 12, noise: false,
          bars: [bar('Evictions first', 86, blue), bar('Chapter budgets', 68, blue), bar('Name landlords', 71, blue)] },
        { title: 'The electoral question splits the union', author: '@millbrook.weekly', source: 'Millbrook · Release 3',
          fair: 'Fair to A 64% · B 58%', forks: 7, noise: false,
          bars: [bar('Endorse · A', 79, ink), bar('Endorse · B', 17, gray), bar('Stay out · B', 68, gray)] },
        { title: 'Rent caps: Millbrook vs. everyone', author: '@jt.o', source: 'Global Q2 + Millbrook',
          fair: 'Fair to A 52% · B 55%', forks: 3, noise: true,
          bars: [bar('Millbrook', 74, blue), bar('Global', 71, blue), bar('Riverside', 66, blue)] }
      ]
    };
  }
}
</script>
</body>
</html>
