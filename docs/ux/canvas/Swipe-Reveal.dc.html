<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results deck</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8D44D}a:hover{color:#F4E57A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #F3F1EA; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 20px 24px 20px; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Swipe-End.dc.html" aria-label="Back" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #181B21; color: #F3F1EA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #B9BDC4">Results · Spring priorities</span>
    <span style="font-family: 'DM Mono', monospace; font-size: 14px; color: #B9BDC4; min-width: 44px; text-align: right">{{pos}}/18</span>
  </div>

  <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; width: 310px; height: 500px; border-radius: 22px; background: #22262C; transform: translateY(22px) scale(0.9)"></div>
    <div style="position: absolute; width: 310px; height: 500px; border-radius: 22px; background: #2C3139; transform: translateY(11px) scale(0.95)"></div>
    <article style="position: absolute; width: 310px; height: 500px; box-sizing: border-box; padding: 22px; border-radius: 22px; background: #F3F1EA; color: #0F1115; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: #0F1115; color: #F3F1EA">{{r.kind}}</span>
        <span style="padding: 3px 8px; border: 2px solid {{r.youInk}}; border-radius: 6px; color: {{r.youInk}}; font-size: 13px; font-weight: 800; letter-spacing: 0.06em; transform: rotate(-4deg)">YOU: {{r.you}}</span>
      </div>
      <p style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800">{{r.text}}</p>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'DM Mono', monospace; font-size: 56px; line-height: 1; color: #1F5FCC">{{r.agree}}%</span>
        <span style="font-size: 15px; color: #4A4F57">agree · ±1</span>
      </div>
      <div style="display: flex; height: 10px; gap: 2px">
        <div style="width: {{r.aw}}; background: #1F5FCC; border-radius: 3px 0 0 3px"></div>
        <div style="width: {{r.dw}}; background: #B24A0C"></div>
        <div style="flex: 1; background: #B8BEC4; border-radius: 0 3px 3px 0"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto; padding-top: 12px; border-top: 1px solid #D8D5CB">
        <div style="display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 14px"><span>Group A</span><span>{{r.a}}% agree</span></div>
        <div style="display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 14px"><span>Group B</span><span>{{r.b}}% agree</span></div>
        <span style="font-size: 14px; line-height: 1.4; color: #4A4F57">{{r.line}}</span>
      </div>
    </article>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #181B21; border-radius: 12px">
      <span style="font-size: 14px; color: #B9BDC4">With the majority so far</span>
      <span style="font-family: 'DM Mono', monospace; font-size: 16px; color: #E8D44D">{{withMajority}}</span>
    </div>
    <button type="button" onClick="{{next}}" style="height: 54px; border: none; border-radius: 14px; background: #E8D44D; color: #0F1115; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Next card</button>
    <a href="B-Release.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; font-size: 14px; font-weight: 700; text-decoration: none">See the full release</a>
    <span style="text-align: center; font-size: 12px; color: #8D939C">Matched on this phone against the published release</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const ink = { AGREE: '#1F5FCC', DISAGREE: '#B24A0C', UNSURE: '#4A4F57' };
    const results = [
      { kind: 'Common ground', you: 'AGREE', text: 'Stopping no-cause evictions should be our first priority this year.', agree: 86, dis: 8, a: 88, b: 83, line: 'Both groups agree. So did you.', maj: '1 of 1' },
      { kind: 'The big split', you: 'DISAGREE', text: 'The union should endorse candidates in local elections.', agree: 48, dis: 41, a: 79, b: 17, line: 'You sided with Group B on this one, though you’re in Group A.', maj: '1 of 2' },
      { kind: 'Too close to call', you: 'UNSURE', text: 'At least half of general meetings should be online.', agree: 44, dis: 40, a: 45, b: 43, line: 'The groups are within noise of each other. Nobody knows, including you.', maj: '1 of 3' }
    ];
    const r0 = results[this.state.i % results.length];
    const r = Object.assign({}, r0, { youInk: ink[r0.you], aw: r0.agree + '%', dw: r0.dis + '%' });
    return {
      r, pos: (this.state.i % results.length) + 1, withMajority: r0.maj,
      next: () => this.setState({ i: this.state.i + 1 })
    };
  }
}
</script>
</body>
</html>
