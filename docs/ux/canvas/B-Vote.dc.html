<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal: voting one at a time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8D44D}a:hover{color:#F4E57A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #F3F1EA; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 20px 24px 20px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="B-Home.dc.html" aria-label="Close" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: #181B21; color: #F3F1EA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #B9BDC4">Fall check-in</span>
    <span style="font-family: 'DM Mono', monospace; font-size: 14px; color: #B9BDC4; min-width: 44px; text-align: right">{{position}}/18</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px">
    <sc-for list="{{segs}}" as="seg" hint-placeholder-count="18">
      <div style="height: 4px; border-radius: 2px; background: {{seg.c}}"></div>
    </sc-for>
  </div>

  <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 8px 4px">
      <sc-if value="{{current.shared}}" hint-placeholder-val="{{false}}">
        <span style="align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #0F1115; background: #E8D44D; border-radius: 999px; padding: 4px 10px">Shared with Global</span>
      </sc-if>
      <p style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">{{current.text}}</p>
      <span style="font-size: 14px; color: #8D939C">{{current.source}}</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{agree}}" style="height: 64px; border: none; border-radius: 14px; background: #6EA8FF; color: #0F1115; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">Agree</button>
        <button type="button" onClick="{{disagree}}" style="height: 64px; border: none; border-radius: 14px; background: #FF9351; color: #0F1115; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">Disagree</button>
      </div>
      <button type="button" onClick="{{pass}}" style="height: 52px; border: 1px solid #3A404A; border-radius: 14px; background: transparent; color: #F3F1EA; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Pass / unsure</button>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px">
        <button type="button" onClick="{{back}}" style="all: unset; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #B9BDC4; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>Previous</button>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #8D939C">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Encrypted on this phone</span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px">
      <span style="font-family: 'DM Mono', monospace; font-size: 64px; line-height: 1; color: #E8D44D">18/18</span>
      <p style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800">You're done. Results land after Oct 21.</p>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #B9BDC4">Change any vote until then. We'll notify you when the release is published.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <a href="B-Release.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; background: #E8D44D; color: #0F1115; border-radius: 14px; font-size: 16px; font-weight: 800; text-decoration: none">See the last release</a>
      <button type="button" onClick="{{restart}}" style="height: 48px; border: 1px solid #3A404A; border-radius: 14px; background: transparent; color: #F3F1EA; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Review my votes</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answers: [] };
  }
  renderVals() {
    const queue = [
      { text: 'Local government listens to people like me.', shared: true, source: 'From Global' },
      { text: 'We should negotiate as a bloc with our largest landlord.', source: 'Added by organizers' },
      { text: 'Members should be able to post statements without organizer review.', source: 'From a member' },
      { text: 'Meetings should offer childcare.', source: 'From a member' },
      { text: 'We should join the citywide tenants’ coalition.', source: 'Added by organizers' },
      { text: 'I’d feel safe if my landlord knew I was in a tenants’ union.', shared: true, source: 'From Global' },
      { text: 'Building chapters should elect their own representatives.', source: 'From a member' }
    ];
    const answers = this.state.answers;
    const idx = answers.length;
    const done = idx >= queue.length;
    const answer = (v) => () => this.setState({ answers: answers.concat([v]) });
    const colors = { agree: '#6EA8FF', disagree: '#FF9351', pass: '#7D848E' };
    const segs = [];
    for (let i = 0; i < 18; i++) {
      let c = '#2A2F37';
      if (i < 11) c = '#5B616B';
      else if (i - 11 < answers.length) c = colors[answers[i - 11]];
      else if (i - 11 === answers.length) c = '#F3F1EA';
      segs.push({ c });
    }
    return {
      current: done ? queue[queue.length - 1] : queue[idx],
      position: Math.min(18, 12 + idx),
      segs, done, notDone: !done,
      agree: answer('agree'), disagree: answer('disagree'), pass: answer('pass'),
      back: () => this.setState({ answers: answers.slice(0, -1) }),
      restart: () => this.setState({ answers: [] })
    };
  }
}
</script>
</body>
</html>
